# ── Server ──────────────────────────────────────
server.port=8080

# ── Database ─────────────────────────────────────
# These are overridden per-environment via env vars in later phases
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devtracker}
spring.datasource.username=${DB_USER:devtracker}
spring.datasource.password=${DB_PASS:Cyber@Monk999}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Vaadin ───────────────────────────────────────
vaadin.launch-browser=false

logging.level.org.hibernate.tool.schema=DEBUG
logging.level.org.hibernate=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG

